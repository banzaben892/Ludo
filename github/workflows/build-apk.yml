name: Build APK

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Install EAS CLI
      run: npm install -g eas-cli
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      with:
        api-level: 31
        build-tools-version: '31.0.0'
    
    - name: Build APK locally
      run: |
        npm run build:android || true
    
    - name: Create APK artifact
      run: |
        mkdir -p ./apk-output
        cp -r dist/* ./apk-output/ || true
    
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: ludo-game-apk
        path: ./apk-output
        retention-days: 30
        if-no-files-found: ignore
